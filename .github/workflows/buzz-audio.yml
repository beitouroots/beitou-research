name: Rebuild Buzz audio

# Manual: re-records audio/<edition>.mp3 from the page as it is now, without touching the
# edition or emailing anyone. Use it after a hand edit to an edition, or if the recording
# step failed during the normal run (the page falls back to the live voice until then).
on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which edition to record'
        required: true
        type: choice
        options: [am, pm, both]
        default: both

concurrency:
  group: daily-buzz   # never overlap a publishing run
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/piper-voices
            ~/.cache/buzz-audio-venv
          key: buzz-audio-${{ runner.os }}-v1

      - name: Record
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.edition }}" in
            both) bash .github/audio/build-audio.sh am; bash .github/audio/build-audio.sh pm;;
            *)    bash .github/audio/build-audio.sh "${{ github.event.inputs.edition }}";;
          esac

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && { echo "No change to the recordings."; exit 0; }
          git commit -m "Rebuild Buzz audio (${{ github.event.inputs.edition }})"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '.status // .' || true
